<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../logo.png" type="image/x-icon">
    <title>Réservation de Poste - Espace VIP</title>
    <link rel="stylesheet" href="place.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div class="page-entiere">
    <div class="boite-reservation">
        <header class="rsv-header">
            <div class="logo">
                <a href="index.html" title="Retour accueil">
                    <img src="../logo.png" alt="Logo">
                </a>
            </div>
            <div class="rsv-logout">
                <button type="button" id="logoutBtn">Déconnexion</button>
            </div>
            <p class="eyebrow">✨ Espace VIP</p>
            <h1>Réservez votre poste de travail</h1>
            <p>Un environnement spacieux conçu pour votre productivité.</p>
        </header>

        <form id="reservationForm">
            <div class="form-container">
                <div class="section">
                    <div class="group">
                        <label>
                            <span class="sigle">👤</span>
                            Informations personnelles
                        </label>
                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Nom complet"
                            required>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Adresse email"
                            required>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Téléphone">
                    </div>

                    <div class="group">
                        <label>
                            <span class="sigle">🍹</span>
                            Votre Machroub préféré
                        </label>
                        <div class="drinks">
                            <label class="drink"><input type="radio" name="m" value="cafe" checked><span>☕ Café</span></label>
                            <label class="drink"><input type="radio" name="m" value="the"><span>🍵 Thé</span></label>
                            <label class="drink"><input type="radio" name="m" value="jus"><span>🥤 Jus</span></label>
                        </div>
                    </div>

                    <div class="group">
                        <label for="complaint">
                            <span class="sigle">📝</span>
                            Réclamation ou remarque (optionnel)
                        </label>
                        <textarea id="complaint" name="complaint" rows="3" placeholder="Partagez votre remarque ici..."></textarea>
                    </div>
                </div>

                <div class="group">
                    <label>
                        <span class="sigle">📅</span>
                        Date, heure et durée de réservation
                    </label>
                    <input type="date" id="reservationDate" name="reservationDate" required>
                    <input type="time" id="reservationTime" name="reservationTime" required>
                    <input type="text" id="reservationDuration" name="reservationDuration" required placeholder="Durée en heures">
                    <div id="heureFin"></div>
                </div>

                <div class="map">
                    <label>
                        <span class="sigle">🗺️</span>
                        Plan de salle interactif
                    </label>

                    <div class="legend">
                        <div class="legend-item">
                            <div class="box"></div>
                            <span>Disponible</span>
                        </div>
                        <div class="legend-item">
                            <div class="box selected"></div>
                            <span>Sélectionné</span>
                        </div>
                        <div class="legend-item">
                            <div class="box occupied"></div>
                            <span>Occupé</span>
                        </div>
                    </div>

                    <div class="plan">
                        <div class="zone">
                            <div class="surface">
                                <span class="sigle">🌟</span>
                                Zone Alpha
                            </div>
                            <div class="seats" data-zone="alpha">
                                <div class="seat free" data-seat="A1" title="Place A1 - Disponible">A1</div>
                                <div class="seat free" data-seat="A2" title="Place A2 - Disponible">A2</div>
                                <div class="seat free" data-seat="A3" title="Place A3 - Disponible">A3</div>
                                <div class="seat free" data-seat="A4" title="Place A4 - Disponible">A4</div>
                                <div class="seat free" data-seat="A5" title="Place A5 - Disponible">A5</div>
                                <div class="seat free" data-seat="A6" title="Place A6 - Disponible">A6</div>
                            </div>
                        </div>
                        <div class="zone">
                            <div class="surface">
                                <span class="sigle">💎</span>
                                Zone Beta
                            </div>
                            <div class="seats" data-zone="beta">
                                <div class="seat free" data-seat="B1" title="Place B1 - Disponible">B1</div>
                                <div class="seat free" data-seat="B2" title="Place B2 - Disponible">B2</div>
                                <div class="seat free" data-seat="B3" title="Place B3 - Disponible">B3</div>
                                <div class="seat free" data-seat="B4" title="Place B4 - Disponible">B4</div>
                                <div class="seat free" data-seat="B5" title="Place B5 - Disponible">B5</div>
                                <div class="seat free" data-seat="B6" title="Place B6 - Disponible">B6</div>
                            </div>
                        </div>

                        <div class="table">
                            <div class="surface">
                                <span class="sigle">🚀</span>
                                Zone Gamma
                            </div>
                            <div class="seats" data-zone="gamma">
                                <div class="seat free" data-seat="C1" title="Place C1 - Disponible">C1</div>
                                <div class="seat free" data-seat="C2" title="Place C2 - Disponible">C2</div>
                                <div class="seat free" data-seat="C3" title="Place C3 - Disponible">C3</div>
                                <div class="seat free" data-seat="C4" title="Place C4 - Disponible">C4</div>
                                <div class="seat free" data-seat="C5" title="Place C5 - Disponible">C5</div>
                                <div class="seat free" data-seat="C6" title="Place C6 - Disponible">C6</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="rsv-footer">
                <button type="submit" class="btn-confirm" id="confirmBtn">
                    <span class="sigle">🎯</span>
                    <span class="text">Confirmer la réservation</span>
                    <span class="price">25 DT / jour</span>
                </button>
            </footer>
        </form>
    </div>
</div>

<script src="../backend/supabase-client.js"></script>
<script src="../backend/place.js"></script>
<script src="../backend/reservation.js"></script>
</body>
</html>
