<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../logo.png" type="image/x-icon">
    <title>Page d'Inscription</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <div class="signup-screen">
    <!-- Left Side: Branding -->
    <div class="signup-brand">
        <div class="signup-brand-content">
            <div class="logo-mark">V</div>
            <h1>Espace VIP</h1>
            <p>Rejoignez notre espace de coworking premium. Réservez votre place idéale et concentrez-vous sur l'essentiel.</p>
        </div>
    </div>

    <!-- Right Side: Form -->
    <div class="signup-form-wrapper">
        <div class="signup-form-box">
            <h2>Créer un compte</h2>
            <p class="subtitle">Rejoignez la communauté Espace VIP dès maintenant.</p>
            
            <form action="#" method="POST">
                

                <div class="groupe-input">
                    <label for="fullname">Nom complet</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Jean Dupont" required>
                </div>
                
                <div class="groupe-input">
                    <label for="email">Adresse Email</label>
                    <input type="email" id="email" name="email" placeholder="nom@exemple.com" required>
                </div>
                
                <div class="groupe-input">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="groupe-input">
                    <label for="confirm_password">Confirmer le mot de passe</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                </div>
                <div id="error-message"></div>
                <button type="submit" class="bouton-inscription" id="signup-btn">S'inscrire</button>
            </form>

            <div class="signup-footer">
                Vous avez déjà un compte ? <a href="login.html">Se connecter</a>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../backend/supabase-client.js"></script>
    <script src="../backend/signup.js"></script>

</body>

</html>
