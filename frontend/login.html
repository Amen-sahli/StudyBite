<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../logo.png" type="image/x-icon">
    <title>Page de Connexion</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-screen">
    <div class="login-brand">
        <div class="login-brand-content">
            <div class="logo-mark">V</div>
            <h1>Espace VIP</h1>
            <p>Experience premium coworking. Reserve your perfect spot, enjoy high-end amenities, and focus on what matters.</p>
        </div>
    </div>
    <div class="login-form-wrapper">
        <div class="login-form-box">
            <h2>Welcome back</h2>
            <p class="subtitle">Connectez-vous pour gérer vos réservations.</p>
            <form action="#" method="POST">
                <div class="groupe-input">
                    <label for="email">Adresse Email</label>
                    <input type="email" id="email" name="email" placeholder="nom@exemple.com" required>
                </div>
                <div class="groupe-input">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <div id="error-message"></div>
                <button type="submit" class="bouton-connexion" id="login-button">Se connecter</button>
            </form>
            <div class="login-footer">
                Pas encore de compte ? <a href="signup.html">Créer un compte</a>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../backend/supabase-client.js"></script>
    <script src="../backend/login.js"></script>

</body>

</html>
